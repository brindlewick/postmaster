<title>Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600;700&family=Red+Hat+Mono:wght@400;500&family=Red+Hat+Text:wght@400;500;600&display=swap">
<style>
/* Layout: phone = header, a strip of file chips, then the file; 760px and up = file list beside the file. */
:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --ink: #1c2230;
  --muted: #5a6475;
  --rule: #dfe3ea;
  --accent: #1d5ca8;
  --accent-soft: #e5eefa;
  --mark: #fff1b5;
  --mark-edge: #d9a700;
  --gutter: #8b94a4;
  --wt: #fbeedf;
  --wt-ink: #8f4a00;
  --hl-keyword: #4338ca;
  --hl-string: #1f6f37;
  --hl-comment: #6b7380;
  --hl-number: #9c4a00;
  --hl-title: #0d6880;
  --hl-type: #8330b0;
  --hl-meta: #a3261a;
  --fade: rgba(28, 34, 48, .13);
  --font-ui: "Red Hat Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Red Hat Display", "Red Hat Text", system-ui, sans-serif;
  --font-code: "Red Hat Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --panel: #181d26; --ink: #e3e7ee; --muted: #9aa3b2; --rule: #2a313d;
    --accent: #8ab8f2; --accent-soft: #1d2b40; --mark: #3d3412; --mark-edge: #c99c1a; --gutter: #6c7686;
    --wt: #3a2a16; --wt-ink: #f0b46a;
    --hl-keyword: #a5b0ff; --hl-string: #8fd69b; --hl-comment: #8b95a5; --hl-number: #f2b66b;
    --hl-title: #6fd0e2; --hl-type: #d6a8ff; --hl-meta: #ff9c8f; --fade: rgba(227, 231, 238, .18);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --panel: #181d26; --ink: #e3e7ee; --muted: #9aa3b2; --rule: #2a313d;
  --accent: #8ab8f2; --accent-soft: #1d2b40; --mark: #3d3412; --mark-edge: #c99c1a; --gutter: #6c7686;
  --wt: #3a2a16; --wt-ink: #f0b46a;
  --hl-keyword: #a5b0ff; --hl-string: #8fd69b; --hl-comment: #8b95a5; --hl-number: #f2b66b;
  --hl-title: #6fd0e2; --hl-type: #d6a8ff; --hl-meta: #ff9c8f; --fade: rgba(227, 231, 238, .18);
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
.app { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding-inline: 16px; padding-block: 16px 32px; max-width: 1400px; margin: 0 auto; }
.top { display: grid; gap: 6px; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--wt-ink); }
h1 { margin: 0; font-family: var(--font-display); font-size: 24px; line-height: 1.2; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 68ch; }
.files { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.files::-webkit-scrollbar { display: none; }
.file { flex: none; display: grid; gap: 2px; text-align: left; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 12px; cursor: pointer; min-width: 0; }
.file:focus-visible, .l:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.file[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.file .fn { font-family: var(--font-code); font-size: 13px; font-weight: 500; }
.file .fr { font-size: 12px; color: var(--muted); }
/* A one-line label (a name, a path) wider than its place scrolls sideways on its own, with no scrollbar, as a line of code does.
   Its text fades out over 10px of padding at each end, which an equal negative margin takes back: a label that fits shows
   no fade and takes no more room. Whatever holds a label leaves 10px beside it. */
.ln { white-space: nowrap; overflow: auto hidden; overscroll-behavior-x: contain; scrollbar-width: none; padding-inline: 10px; margin-inline: -10px; -webkit-mask-image: linear-gradient(to right, transparent, #000 10px, #000 calc(100% - 10px), transparent); mask-image: linear-gradient(to right, transparent, #000 10px, #000 calc(100% - 10px), transparent); }
.ln::-webkit-scrollbar { display: none; }
.viewer { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 14px; background: var(--bg); padding-block: 8px; border-bottom: 1px solid var(--rule); }
.path { display: grid; min-width: 0; }
#fpath { font-family: var(--font-code); font-size: 13px; font-weight: 500; }
#fmeta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.wrap { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
/* Lines wider than the code box scroll sideways with no scrollbar, a run of consecutive ones together as a group, a single one
   alone; a line that fits ends a run. The script wraps each run in one scroll container, .grp, and makes the runs again when the
   width, Fold or the fonts change; the code box and the page never scroll. The number stays at the left edge of its line, on the
   line's own colour. A group that goes on past its right edge has a faint shade there: every row of it holds a sticky layer at
   the edge, and the script shows it where the group has more behind it. Fold turns the lines into wrapped ones. */
.code { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; font-family: var(--font-code); font-size: 12.5px; line-height: 1.6; padding-block: 8px; }
.lines { container-type: inline-size; }
.l { --rb: var(--panel); display: flex; position: relative; isolation: isolate; background: var(--rb); scroll-margin-top: 72px; }
.grp { display: grid; grid-template-columns: minmax(max-content, 1fr); container-type: inline-size; overflow: auto hidden; overscroll-behavior-x: contain; scrollbar-width: none; }
.grp::-webkit-scrollbar { display: none; }
.grp > .l::after { content: ""; order: -1; flex: none; position: sticky; left: calc(100cqw - 16px); width: 16px; margin-right: -16px; align-self: stretch; z-index: -1; pointer-events: none; background: linear-gradient(to left, var(--fade), transparent); visibility: hidden; }
.grp[data-r] > .l::after { visibility: visible; }
.n { flex: none; position: sticky; left: 0; z-index: 1; box-sizing: border-box; width: calc(var(--digits, 3) * 1ch + 1.8ch); background: var(--rb); color: var(--gutter); text-align: right; padding-right: 1ch; user-select: none; -webkit-user-select: none; font-variant-numeric: tabular-nums; }
.c { position: relative; z-index: 0; flex: none; white-space: pre; padding-right: 14px; }
.fold .c { flex: 1 1 0; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.l.sel { --rb: var(--mark); }
.l.sel .n { color: var(--ink); box-shadow: inset 3px 0 0 var(--mark-edge); }
.status { padding: 14px; color: var(--muted); font-family: var(--font-ui); }
.hljs-keyword, .hljs-built_in, .hljs-literal, .hljs-selector-tag { color: var(--hl-keyword); }
.hljs-string, .hljs-regexp, .hljs-template-string, .hljs-code { color: var(--hl-string); }
.hljs-comment, .hljs-quote { color: var(--hl-comment); font-style: italic; }
.hljs-number, .hljs-bullet, .hljs-symbol { color: var(--hl-number); }
.hljs-title, .hljs-section, .hljs-name, .hljs-attr, .hljs-property { color: var(--hl-title); }
.hljs-section { font-weight: 600; }
.hljs-type, .hljs-params, .hljs-variable, .hljs-template-variable { color: var(--hl-type); }
.hljs-meta, .hljs-link, .hljs-deletion { color: var(--hl-meta); }
.hljs-strong { font-weight: 600; }
.hljs-emphasis { font-style: italic; }
.foot { font-size: 12.5px; color: var(--muted); max-width: 68ch; margin: 0; }
@media (min-width: 760px) {
  .app { grid-template-columns: 270px minmax(0, 1fr); grid-template-areas: "top top" "files viewer" "foot viewer"; align-items: start; column-gap: 22px; }
  .top { grid-area: top; }
  .files { grid-area: files; flex-direction: column; overflow: visible; position: sticky; top: 16px; }
  .file { flex: initial; }
  .viewer { grid-area: viewer; }
  .foot { grid-area: foot; }
  .code { font-size: 13.5px; }
  h1 { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <header class="top">
    <p class="eyebrow" id="eyebrow">Code</p>
    <h1 id="h1">Code</h1>
    <p class="lede">Select any text to comment on it, if the host that shows this page takes comments. A link to cited lines lights them.</p>
  </header>

  <nav class="files" id="files" aria-label="Files"></nav>

  <main class="viewer">
    <div class="bar">
      <div class="path"><span id="fpath" class="ln" tabindex="-1">Loading…</span><span id="fmeta"></span></div>
      <label class="wrap" for="wrap"><input type="checkbox" id="wrap"> Wrap long lines</label>
    </div>
    <div class="code" id="code" role="region" aria-label="File contents"><div class="status">Loading the file…</div></div>
  </main>

  <p class="foot">Colours come from highlight.js 11.11.1; if it cannot load, the file shows as plain text.</p>
</div>

<!-- page data -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script>
// The files are inline, written into the page by scripts/review-page.ts.
let FILES = [];
let REF = "";
const WHERE = { at: "As it stands at " };

const $ = (id) => document.getElementById(id);
const cache = new Map();
let current = null;
let sel = null;

function baseName(path) { return path.split("/").at(-1); }

function renderFileList() {
  const nav = $("files");
  for (const f of FILES) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "file";
    b.id = "pick-" + f.id;
    b.dataset.id = f.id;
    // A name wider than its place scrolls on its own (the .ln rule); a scroller is a tab stop in Chrome, so each is kept out of the tab order.
    const fn = document.createElement("span"); fn.className = "fn ln"; fn.tabIndex = -1; fn.textContent = baseName(f.path);
    const fr = document.createElement("span"); fr.className = "fr ln"; fr.tabIndex = -1; fr.textContent = f.path.split("/").slice(0, -1).join("/") || ".";
    b.append(fn, fr);
    b.addEventListener("click", () => openFile(f.id, null));
    nav.append(b);
  }
}

// Split highlight.js output into lines, carrying each text run's classes.
function toLines(html) {
  const tpl = document.createElement("template");
  tpl.innerHTML = html;
  const lines = [[]];
  const walk = (node, classes) => {
    for (const child of node.childNodes) {
      if (child.nodeType === Node.TEXT_NODE) {
        child.nodeValue.split("\n").forEach((part, i) => {
          if (i > 0) lines.push([]);
          if (part) lines.at(-1).push({ text: part, cls: classes });
        });
      } else if (child.nodeType === Node.ELEMENT_NODE) {
        walk(child, child.className ? classes.concat(String(child.className).split(/\s+/)) : classes);
      }
    }
  };
  walk(tpl.content, []);
  return lines;
}

function plainLines(text) { return text.split("\n").map((t) => (t ? [{ text: t, cls: [] }] : [])); }

function highlight(text, lang) {
  try {
    if (window.hljs && hljs.getLanguage(lang)) return toLines(hljs.highlight(text, { language: lang, ignoreIllegals: true }).value);
  } catch (e) { /* plain text below */ }
  return plainLines(text);
}

async function load(f) {
  if (cache.has(f.id)) return cache.get(f.id);
  const raw = f.text;
  const text = raw.endsWith("\n") ? raw.slice(0, -1) : raw;
  const entry = { text, bytes: new TextEncoder().encode(raw).length, lines: highlight(text, f.lang) };
  cache.set(f.id, entry);
  return entry;
}

function renderLines(f, entry) {
  const box = document.createElement("div");
  box.className = "lines";
  box.style.setProperty("--digits", String(String(entry.lines.length).length));
  entry.lines.forEach((runs, i) => {
    const n = i + 1;
    const row = document.createElement("div");
    row.className = "l";
    row.id = f.id + "-L" + n;
    const num = document.createElement("span"); num.className = "n"; num.textContent = String(n);
    const code = document.createElement("span"); code.className = "c";
    for (const r of runs) {
      if (r.cls.length) { const s = document.createElement("span"); s.className = r.cls.join(" "); s.textContent = r.text; code.append(s); }
      else code.append(document.createTextNode(r.text));
    }
    if (!runs.length) code.append(document.createTextNode(" "));
    row.append(num, code);
    box.append(row);
  });
  return box;
}

async function openFile(id, range) {
  const f = FILES.find((x) => x.id === id) ?? FILES[0];
  current = f;
  sel = null;
  for (const b of document.querySelectorAll(".file")) b.setAttribute("aria-current", String(b.dataset.id === f.id));
  $("fpath").textContent = f.path;
  $("fmeta").textContent = WHERE.at + REF.slice(0, 7);
  const code = $("code");
  code.replaceChildren(Object.assign(document.createElement("div"), { className: "status", textContent: "Loading " + baseName(f.path) + "…" }));
  try {
    const entry = await load(f);
    if (current !== f) return;
    $("fmeta").textContent = WHERE.at + REF.slice(0, 7) + " · " + entry.lines.length + " lines · " + (entry.bytes / 1024).toFixed(1) + " KB";
    code.replaceChildren(renderLines(f, entry));
    regroup();
    if (range) { select(range.from, range.to); scrollToLine(range.from); }
    else code.scrollTop = 0;
  } catch (e) {
    code.replaceChildren(Object.assign(document.createElement("div"), { className: "status", textContent: "Could not load " + f.path + " (" + e.message + "). Reload the page to try again." }));
  }
}

// Groups of lines: a run of consecutive lines wider than the code box scrolls sideways together, wrapped in one scroll
// container (.grp), a single such line alone; a line that fits ends a run. The runs are made again when the width, Fold or
// the fonts change. Where a group has more of itself to the right, its rows show the shade of it.
function edges(g) { g.toggleAttribute("data-r", g.scrollLeft + g.clientWidth < g.scrollWidth - 1); }

function regroup() {
  const box = $("code").querySelector(".lines");
  if (!box || box.clientWidth === 0) return;
  const rows = Array.from(box.querySelectorAll(".l"));
  const wide = rows.map((r) => !$("code").classList.contains("fold") && r.lastElementChild.offsetWidth > box.clientWidth + 1);
  box.replaceChildren(...rows);
  let run = null;
  rows.forEach((r, i) => {
    if (!wide[i]) { run = null; return; }
    if (run === null) { run = document.createElement("div"); run.className = "grp"; run.tabIndex = -1; r.before(run); }
    run.append(r);
  });
  for (const g of box.querySelectorAll(".grp")) edges(g);
}

$("code").addEventListener("scroll", (ev) => { if (ev.target.matches(".grp")) edges(ev.target); }, true);
new ResizeObserver(regroup).observe($("code"));
document.fonts.addEventListener("loadingdone", regroup);

function scrollToLine(n) {
  const row = $(current.id + "-L" + n);
  if (row) row.scrollIntoView({ block: "center" });
}

function select(from, to) {
  const a = Math.min(from, to), b = Math.max(from, to);
  sel = { from: a, to: b };
  for (const row of document.querySelectorAll(".l.sel")) row.classList.remove("sel");
  for (let n = a; n <= b; n++) $(current.id + "-L" + n)?.classList.add("sel");
}

$("wrap").addEventListener("change", (ev) => { $("code").classList.toggle("fold", ev.target.checked); regroup(); });

function fromHash() {
  const m = /^#(f\d+)(?:-L(\d+)(?:-L(\d+))?)?$/.exec(location.hash);
  if (!m || !FILES.some((f) => f.id === m[1])) return null;
  const from = m[2] ? Number(m[2]) : null;
  return { id: m[1], range: from ? { from, to: m[3] ? Number(m[3]) : from } : null };
}

(async () => {
  try {
    const node = document.getElementById("files-data"); if (!node) throw new Error("no data in the page");
    const data = JSON.parse(node.textContent); FILES = data.files; REF = data.ref || "";
    if (data.title) { $("h1").textContent = data.title; $("eyebrow").textContent = "Code · " + FILES.length + (FILES.length === 1 ? " file" : " files"); }
  } catch (e) { $("fpath").textContent = "The file list did not load (" + e.message + "). Reload to try again."; return; }
  renderFileList();
  const start = fromHash();
  if (start) openFile(start.id, start.range); else if (FILES.length) openFile(FILES[0].id, null);
  window.addEventListener("hashchange", () => { const h = fromHash(); if (h) openFile(h.id, h.range); });
})();

</script>
