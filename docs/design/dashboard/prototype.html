<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

</head>
<body>
<!-- The prototype as written starts on the next line. -->
<title>postmaster dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
:root {
  color-scheme: light;
  --paper:#fcfaee; --surface:#fffdf5; --wash:#f1f0e4; --ink:#304862; --soft-ink:#526473;
  --muted:#65716e; --rule:#c0c5b9; --strong-rule:#304862; --coral:#f67355; --coral-ink:#a7402c;
  --coral-wash:#fce8dc; --good:#466248; --good-wash:#eaf0e2; --terminal:#273b4e; --terminal-ink:#f2eedc;
  --terminal-muted:#b0c0c6; --terminal-rule:#53697a; --selection:#f9d8bc; --transparent:transparent;
  --keyword:#855075; --string:#55723e; --number:#ac4d36; --comment:#667774; --code-tag:#365c86;
  --scrim:#172734a8; --shadow:#30486216;
  --display:'DM Serif Display',Georgia,'Times New Roman',serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',Consolas,'Liberation Mono',monospace;
  --sans:Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    color-scheme:dark;
    --paper:#192630; --surface:#20303b; --wash:#283844; --ink:#e9e5d3; --soft-ink:#c1c8c6;
    --muted:#a8b8b9; --rule:#495a61; --strong-rule:#9aafba; --coral:#f68d73; --coral-ink:#ffaf95;
    --coral-wash:#43332f; --good:#afc69b; --good-wash:#2c3b33; --terminal:#14212c; --terminal-ink:#f2eedc;
    --terminal-muted:#b0c0c6; --terminal-rule:#53697a; --selection:#654a38; --transparent:transparent;
    --keyword:#d9acd1; --string:#bdd498; --number:#ffac91; --comment:#a1b5b1; --code-tag:#a9c9ee;
    --scrim:#101b24bd; --shadow:#101b2438;
  }
}
:root[data-theme="dark"] {
  color-scheme:dark;
  --paper:#192630; --surface:#20303b; --wash:#283844; --ink:#e9e5d3; --soft-ink:#c1c8c6;
  --muted:#a8b8b9; --rule:#495a61; --strong-rule:#9aafba; --coral:#f68d73; --coral-ink:#ffaf95;
  --coral-wash:#43332f; --good:#afc69b; --good-wash:#2c3b33; --terminal:#14212c; --terminal-ink:#f2eedc;
  --terminal-muted:#b0c0c6; --terminal-rule:#53697a; --selection:#654a38; --transparent:transparent;
  --keyword:#d9acd1; --string:#bdd498; --number:#ffac91; --comment:#a1b5b1; --code-tag:#a9c9ee;
  --scrim:#101b24bd; --shadow:#101b2438;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.55 var(--serif); }
button,input,select,textarea { font:inherit; color:inherit; }
button,a,summary,select { -webkit-tap-highlight-color:var(--selection); touch-action:manipulation; }
button { cursor:pointer; }
button,a,summary { outline-offset:4px; }
:focus-visible { outline:2px solid var(--coral-ink); }
button { border:0; background:var(--transparent); }
a { color:inherit; text-underline-offset:4px; }
button,summary,select,.button { min-height:44px; }
button:disabled { opacity:.38; cursor:default; }
svg { display:block; max-width:100%; }
h1,h2,h3,h4,p { margin:0; }
h1,h2,h3,h4 { font-weight:400; }
h1,h2,h3 { font-family:var(--display); line-height:1.15; }
div,section,article,aside,nav,main,header,footer,fieldset,span,pre,code { min-width:0; }
[hidden] { display:none!important; }
::selection { background:var(--selection); color:var(--ink); }
.site { padding:0 28px; max-width:2000px; margin:auto; }
.masthead { display:flex; align-items:center; gap:28px; min-height:81px; border-bottom:1px solid var(--strong-rule); }
.brand { display:flex; align-items:center; gap:11px; padding:0; font:32px/1 var(--display); letter-spacing:-1.2px; }
.brand-mark { width:26px; height:30px; color:var(--coral); }
.mast-nav { margin-left:28px; font:13px var(--sans); align-self:stretch; display:flex; align-items:stretch; }
.mast-nav button { position:relative; padding:0 3px; }
.mast-nav button:after { position:absolute; content:''; height:3px; background:var(--coral); bottom:-2px; left:0; right:0; }
.mast-project { margin-left:auto; font:14px var(--serif); display:flex; gap:10px; align-items:center; }
.diamond { width:7px; height:7px; border:1px solid currentColor; transform:rotate(45deg); display:inline-block; flex-shrink:0; }
.freshness { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--rule); font:10px/1.5 var(--mono); letter-spacing:.02em; }
.freshness-state { display:flex; align-items:center; gap:8px; }
.fresh-dot { width:5px; height:5px; background:var(--good); border-radius:50%; flex:none; }
.freshness.stale { color:var(--coral-ink); border-bottom-color:var(--coral); }
.stale .fresh-dot { background:var(--coral); border-radius:0; transform:rotate(45deg); }
.eyebrow,.small-label { font:10px/1.5 var(--mono); letter-spacing:.13em; text-transform:uppercase; }
.eyebrow { color:var(--soft-ink); }
.underline { background:linear-gradient(var(--transparent) 82%,var(--coral) 82%,var(--coral) 93%,var(--transparent) 93%); box-decoration-break:clone; -webkit-box-decoration-break:clone; padding:0 .025em; }
.home-hero { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:50px; padding:36px 0 31px; align-items:center; }
.home-title { font-size:clamp(40px,4.7vw,70px); line-height:1.03; letter-spacing:-1.8px; margin:12px 0 16px; }
.home-intro { font-size:14px; color:var(--soft-ink); }
.telemetry { padding-top:2px; }
.machine-heading { display:flex; justify-content:space-between; gap:12px; padding-bottom:12px; border-bottom:1px solid var(--strong-rule); }
.machine-heading .small-label { letter-spacing:.09em; }
.machine-now { font:10px var(--mono); color:var(--muted); }
.metrics { display:grid; grid-template-columns:1fr 1fr; margin:15px 0 5px; }
.metric { padding-right:23px; }
.metric+.metric { border-left:1px solid var(--rule); padding-left:23px; padding-right:0; }
.metric-head { display:flex; gap:10px; align-items:baseline; justify-content:space-between; }
.metric-value { font:43px/1.1 var(--display); letter-spacing:-1px; }
.metric-value small { font:22px var(--serif); }
.metric-label { font:10px var(--mono); text-transform:uppercase; letter-spacing:.1em; }
.metric-detail { margin:5px 0 9px; font:10px var(--mono); color:var(--soft-ink); }
.spark { width:100%; height:47px; overflow:visible; color:var(--ink); }
.spark.memory { color:var(--coral); }
.spark-grid { stroke:var(--rule); stroke-width:.5; }
.spark-line { fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.chart-caption { display:flex; justify-content:space-between; color:var(--muted); font:9px var(--mono); margin-top:4px; }
.machine-more { font:11px var(--mono); border-top:1px solid var(--rule); margin-top:13px; }
.machine-more summary { display:flex; align-items:center; justify-content:space-between; }
.machine-more p { padding:0 0 12px; color:var(--soft-ink); line-height:1.8; }
summary { list-style:none; cursor:pointer; }
summary::-webkit-details-marker { display:none; }
summary:after { content:'+'; font:20px/1 var(--serif); margin-left:auto; flex:none; }
details[open]>summary:after { content:'−'; }
.index-nav { display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--strong-rule); border-bottom:1px solid var(--strong-rule); padding:12px 0; margin-bottom:19px; }
.index-link { display:flex; align-items:center; gap:16px; padding:3px 20px; text-align:left; border-right:1px solid var(--rule); }
.index-link:first-child { padding-left:0; }
.index-link:last-child { border-right:0; }
.index-number { font:36px/1 var(--display); }
.index-copy { font:14px var(--serif); }
.index-copy small { display:block; font:9px/1.8 var(--mono); color:var(--muted); margin-top:3px; }
.index-link:hover .index-copy { text-decoration:underline; text-decoration-color:var(--coral); text-underline-offset:5px; }
.notice-bar { display:flex; align-items:center; gap:13px; background:var(--ink); color:var(--paper); padding:0 0 0 17px; min-height:48px; margin-bottom:27px; font:13px var(--serif); }
.notice-bar .diamond { color:var(--coral); width:9px; height:9px; }
.notice-bar strong { font-weight:600; }
.notice-bar .notice-explanation { opacity:.8; font-size:12px; }
.notice-bar button { margin-left:auto; background:var(--coral); color:var(--terminal); min-height:48px; padding:10px 19px; font:12px var(--sans); display:flex; align-items:center; gap:24px; }
.home-layout { display:grid; grid-template-columns:1fr; gap:28px; }
.home-attention,.home-activity { display:flex; flex-direction:column; gap:28px; }
.section-head { display:flex; align-items:center; gap:12px; border-top:1px solid var(--strong-rule); margin-bottom:21px; padding-top:15px; }
.section-head h2 { font-size:25px; text-decoration:underline; text-decoration-color:var(--coral); text-decoration-thickness:3px; text-underline-offset:3px; }
.section-head .count { font:11px var(--mono); padding:1px 6px; border:1px solid var(--rule); }
.section-head .small-label { margin-left:auto; font-size:9px; text-align:right; letter-spacing:.02em; color:var(--muted); }
.folio-card { position:relative; border:1px solid var(--strong-rule); background:var(--surface); padding:20px 17px 14px; margin:9px 0 20px; }
.card-legend { position:absolute; top:0; left:11px; transform:translateY(-55%); background:var(--paper); padding:0 7px; font:10px var(--mono); letter-spacing:.045em; }
.fleet-card { border-color:var(--coral); background:var(--coral-wash); padding-top:19px; }
.fleet-card .card-legend { color:var(--coral-ink); }
.fleet-card .prose { font-size:14px; }
.fleet-card .prose h2 { font-size:23px; margin-top:0; }
.card-foot { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:16px; padding-top:11px; border-top:1px solid var(--rule); font:10px var(--mono); color:var(--soft-ink); }
.question-card h3 { font-size:22px; line-height:1.15; margin-bottom:11px; }
.question-card .question { font-size:14px; line-height:1.65; color:var(--soft-ink); }
.question-card .run-link { display:flex; gap:12px; align-items:center; width:100%; text-align:left; padding:0; margin-bottom:8px; }
.question-card .run-link h3 { margin:0; }
.question-card .run-link .arrow { margin-left:auto; }
.arrow { font:22px/1 var(--serif); flex:none; }
.minor-button { font:11px var(--sans); min-height:44px; padding:8px 0 8px 10px; text-align:right; }
.card-meta { font:10px/1.9 var(--mono); color:var(--muted); margin-top:11px; }
.usage { display:flex; flex-wrap:wrap; gap:4px 12px; font:10px/1.7 var(--mono); color:var(--soft-ink); }
.usage span { white-space:nowrap; }
.usage .usage-label { font-size:8px; color:var(--muted); margin-right:3px; }
.run-card { position:relative; display:block; border:1px solid var(--rule); padding:14px; background:var(--surface); margin-bottom:12px; }
.run-card.stalled { border:2px solid var(--coral); padding:13px; background:var(--coral-wash); }
.card-health { font:9px/1.5 var(--mono); display:flex; align-items:center; flex-wrap:wrap; gap:5px; letter-spacing:.035em; margin:-14px -14px 11px; padding:7px 10px; background:var(--coral); color:var(--terminal); }
.run-card:not(.stalled) .card-health { display:none; }
.run-card .run-link { display:block; width:100%; text-align:left; padding:0; color:var(--ink); }
.ticket-kicker { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:8px; font:11px var(--mono); color:var(--soft-ink); }
.run-card h3 { font-size:21px; line-height:1.2; }
.run-card .run-link:hover h3 { text-decoration:underline; text-decoration-color:var(--coral); text-underline-offset:4px; }
.run-card .next-row { border-top:1px solid var(--rule); margin-top:14px; padding-top:10px; display:flex; align-items:center; flex-wrap:wrap; gap:7px; font:9px/1.4 var(--mono); }
.next-code { color:var(--ink); letter-spacing:.04em; }
.round { display:inline-block; font:9px/1.6 var(--mono); }
.past-cap { background:var(--coral-wash); color:var(--coral-ink); border:1px solid var(--coral); padding:2px 6px; }
.held-label { color:var(--soft-ink); border:1px solid var(--rule); padding:1px 4px; font:9px var(--mono); }
.run-card.held { background:var(--wash); }
.run-card .usage { border-top:1px solid var(--rule); margin-top:11px; padding-top:9px; }
.stage-heading { display:none; }
.empty-stage { display:none; }
.closed-grid { display:grid; gap:12px; }
.closed-grid .run-card { margin:0; }
.closed-outcome { margin-top:9px; color:var(--soft-ink); font:12px/1.5 var(--serif); }
.page-foot { margin-top:38px; padding:18px 0 25px; border-top:1px solid var(--strong-rule); display:flex; justify-content:space-between; align-items:center; gap:18px; font:10px/1.7 var(--mono); color:var(--muted); }
.page-foot .foot-brand { font:20px var(--display); color:var(--ink); }
.breadcrumb { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:16px 0 12px; font:11px var(--mono); color:var(--soft-ink); }
.breadcrumb button { padding:0 2px; }
.breadcrumb .separator { color:var(--coral); }
.run-shell { display:grid; grid-template-columns:minmax(0,1fr); gap:25px; }
.run-rail { display:none; }
.mobile-run-list { border:1px solid var(--rule); margin-bottom:20px; }
.mobile-run-list>summary { display:flex; align-items:center; padding:0 14px; font:12px var(--mono); }
.rail-head { display:flex; justify-content:space-between; align-items:baseline; padding-bottom:15px; border-bottom:1px solid var(--strong-rule); }
.rail-head h2 { font-size:25px; }
.rail-group { margin-top:20px; }
.rail-label { font:9px var(--mono); letter-spacing:.07em; text-transform:uppercase; margin-bottom:8px; color:var(--muted); }
.rail-item { min-height:68px; display:block; width:100%; text-align:left; padding:10px; border:1px solid var(--transparent); border-bottom-color:var(--rule); }
.rail-item.selected { border-color:var(--strong-rule); background:var(--wash); box-shadow:inset 3px 0 var(--coral); }
.rail-item strong { font:10px var(--mono); display:flex; justify-content:space-between; gap:8px; margin-bottom:5px; }
.rail-item strong .small-label { font:9px/1.5 var(--mono); }
.rail-item span { display:block; font:14px/1.35 var(--serif); }
.rail-item.stalled strong { color:var(--coral-ink); }
.rail-item:hover { background:var(--wash); }
.run-heading { display:flex; align-items:flex-start; gap:20px; justify-content:space-between; }
.run-heading h1 { font-size:clamp(31px,3.25vw,47px); letter-spacing:-.6px; margin:9px 0 13px; }
.run-heading-actions { display:flex; flex-direction:column; gap:6px; flex-shrink:0; align-items:stretch; padding-top:2px; }
.button { display:inline-flex; align-items:center; justify-content:center; gap:20px; padding:10px 16px; font:12px var(--sans); border:1px solid var(--strong-rule); text-decoration:none; text-align:center; }
.button.coral { background:var(--coral); border-color:var(--coral); color:var(--terminal); }
.button.quiet { border-color:var(--rule); }
.run-facts { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; margin:6px 0 15px; font:11px var(--mono); color:var(--soft-ink); }
.run-facts>span { display:inline-flex; align-items:center; gap:6px; }
.section-nav { display:flex; flex-wrap:wrap; column-gap:22px; border-top:1px solid var(--strong-rule); border-bottom:1px solid var(--rule); margin:19px 0 25px; }
.section-nav button { padding:0; font:12px var(--sans); }
.section-nav button:hover { text-decoration:underline; text-decoration-color:var(--coral); text-underline-offset:5px; }
.run-columns { display:grid; grid-template-columns:minmax(0,1fr); gap:25px; }
.run-columns>div { display:flex; flex-direction:column; gap:22px; }
.panel { border:1px solid var(--strong-rule); margin-top:9px; position:relative; background:var(--surface); }
.panel>.panel-label { position:absolute; top:0; left:13px; background:var(--paper); padding:0 7px; transform:translateY(-55%); font:11px var(--mono); }
.panel-body { padding:23px 19px 18px; }
.wait-panel { border-color:var(--coral); background:var(--coral-wash); }
.wait-panel .panel-label { color:var(--coral-ink); }
.wait-panel h2 { font-size:28px; margin-bottom:13px; }
.wait-panel .wait-clock { font:12px var(--mono); margin:13px 0 0; }
.empty-state { color:var(--muted); font:14px/1.6 var(--serif); padding:4px 0; }
.outcome-note { margin:13px 0 0; color:var(--soft-ink); }
.fold { border:1px solid var(--rule); margin:0 0 12px; background:var(--surface); }
.fold>summary { display:flex; align-items:center; gap:10px; padding:13px 16px; min-height:61px; }
.fold-title { font:19px/1.25 var(--display); }
.fold-meta { display:block; font:9px/1.6 var(--mono); color:var(--muted); margin-top:4px; overflow-wrap:anywhere; }
.fold-content { padding:1px 16px 19px; border-top:1px solid var(--rule); }
.fold-content>.prose { padding-top:15px; }
.ruling { border-left:3px solid var(--coral); padding:10px 13px; margin-top:15px; background:var(--wash); }
.ruling .small-label { margin-bottom:8px; color:var(--muted); }
.prose { font:15px/1.7 var(--serif); overflow-wrap:anywhere; }
.prose h1,.prose h2,.prose h3,.prose h4 { font-family:var(--display); line-height:1.25; margin:22px 0 11px; }
.prose h1 { font-size:25px; }
.prose h2 { font-size:22px; }
.prose h3,.prose h4 { font-size:18px; }
.prose>:first-child { margin-top:0; }
.prose>:last-child { margin-bottom:0; }
.prose p { margin:0 0 13px; }
.prose ul,.prose ol { padding-left:23px; margin:10px 0 17px; }
.prose li { padding-left:3px; margin-bottom:7px; }
.prose li::marker { color:var(--coral-ink); }
.prose a { display:inline-flex; align-items:center; min-height:44px; overflow-wrap:anywhere; }
.prose code { font:.8em/1.6 var(--mono); background:var(--wash); padding:2px 4px; overflow-wrap:anywhere; }
.prose pre { padding:13px; background:var(--wash); white-space:pre-wrap; overflow-wrap:anywhere; border-left:2px solid var(--coral); }
.prose pre code { padding:0; }
.prose .table-box { overflow-x:auto; margin:15px 0; }
.prose table { font-size:12px; min-width:300px; width:100%; border-collapse:collapse; }
.prose th,.prose td { text-align:left; padding:9px 10px; border:1px solid var(--rule); }
.prose th { font-weight:600; background:var(--wash); }
.prose blockquote { border-left:2px solid var(--coral); padding-left:15px; margin:12px 0; }
.timing-totals { display:flex; gap:30px; margin-bottom:20px; }
.timing-totals strong { display:block; font:29px var(--display); }
.timing-totals span { font:9px var(--mono); color:var(--muted); }
.timing-legend { display:flex; gap:20px; margin-bottom:16px; font:10px var(--mono); }
.legend-swatch { display:inline-block; width:9px; height:9px; margin-right:6px; background:var(--ink); }
.legend-swatch.waiting { background:var(--coral); }
.timing-row { margin-bottom:14px; }
.timing-row-head { display:flex; justify-content:space-between; gap:10px; font:11px var(--mono); }
.timing-row-time { white-space:nowrap; color:var(--muted); font-size:10px; }
.timing-bar { height:7px; background:var(--wash); margin:7px 0 4px; display:flex; }
.active-time { background:var(--ink); }
.waiting-time { background:repeating-linear-gradient(135deg,var(--coral),var(--coral) 2px,var(--coral-wash) 2px,var(--coral-wash) 4px); }
.timing-breakdown { font:9px var(--mono); color:var(--muted); }
.review-section .section-head { margin-bottom:15px; }
.round-summary { display:flex; flex-direction:column; gap:5px; flex:1; }
.round-summary-top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.round-progress { height:4px; background:var(--wash); margin:15px 0 8px; }
.round-progress span { height:100%; display:block; background:var(--ink); max-width:100%; }
.round-progress.past span { background:var(--coral); }
.reviewer-row { display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:4px 10px; padding:10px 0; border-bottom:1px solid var(--rule); }
.reviewer-row .person { font:12px var(--serif); }
.reviewer-row .person small { display:block; font:9px/1.8 var(--mono); color:var(--muted); }
.status { font:9px/1.6 var(--mono); padding:2px 5px; border:1px solid var(--rule); }
.status.issue { color:var(--coral-ink); border-color:var(--coral); }
.status.running { background:var(--wash); }
.findings-head { margin:20px 0 10px; font:11px var(--mono); }
.finding { border-top:1px solid var(--rule); padding:11px 0; }
.finding-labels { display:flex; flex-wrap:wrap; gap:7px; align-items:center; font:9px var(--mono); color:var(--muted); margin-bottom:6px; }

    "head": "8e02f6b",
    "spec": "# Workhorse spec: #47, Watch mode rebuilds only the pages a change touches\n\n## Summary\n\n`buildSite` records, for each page, the files it used: its source, its layout and the theme's partials. `watchSite` keeps that record and, after the first build, rebuilds only the pages that use a changed file.\n\n## Structure\n\n- `src/dep-graph.ts`: the record of which pages use which files, and its tests.\n- `src/build.ts`: one page built by `buildOne`; `buildPages` builds a given list.\n- `src/watch.ts`: changed files gathered for 80 ms, then the pages that use them rebuilt.\n\n## Decisions\n\n1. A rename whose old name is gone triggers a full build, since the record cannot tell which pages included it.\n2. Any failed rebuild makes the next one full.\n\n## Showing each criterion\n\n| criterion | check |\n|---|---|\n| 1 | edit one page of `examples/large` under `marigold watch`, and read the log line |\n| 2 | edit `themes/default/tag.html`, and count the pages rebuilt |\n| 3 | add, delete and rename a page, then rename a partial |\n| 4 | break a template, save, fix it, save |\n\n## Tasks\n\n- [ ] T001 [AC1, AC2] the dependency graph and its tests\n- [ ] T002 [AC1] `buildOne` and `buildPages`\n- [ ] T003 [AC1 to AC4] the watcher\n",
    "summary": "`marigold watch` rebuilds only the pages a change touches, after its first full build.\n\n- `src/dep-graph.ts` records which files each page used: its source, its layout and the partials.\n- `src/build.ts` builds one page at a time through `buildOne`, records what it used, and gains `buildPages` for a list of pages.\n- `src/watch.ts` gathers changed files for 80 ms, then rebuilds the pages that use them. A rename whose old name is gone, and any failed rebuild, make the next build a full one.\n\nOn the 1,200-page example a one-word edit shows in 0.3 s, against 40 s before.\n\n**Checks.** The gate passed at the head (`8e02f6b`). Three review rounds; one P2 is open, a rename on macOS, and it waits on the user's word.\n",
    "files": [
     {
      "path": "src/dep-graph.ts",
      "status": "A",
      "additions": 33,
      "deletions": 0,
      "lang": "typescript",
      "lines": 33,
      "diff": "@@ -0,0 +1,33 @@\n+// Which pages use which files: a page uses its source, its layout and the theme's partials.\n+// After a change, exactly the pages that use a changed file are built again.\n+\n+export class DependencyGraph {\n+  private readonly users = new Map\u003cstring, Set\u003cstring\u003e\u003e();\n+\n+  record(page: string, files: Iterable\u003cstring\u003e): void {\n+    this.forget(page);\n+    for (const file of files) {\n+      let pages = this.users.get(file);\n+      if (!pages) {\n+        pages = new Set();\n+        this.users.set(file, pages);\n+      }\n+      pages.add(page);\n+    }\n+  }\n+\n+  forget(page: string): void {\n+    for (const pages of this.users.values()) pages.delete(page);\n+  }\n+\n+  pagesUsing(file: string): string[] {\n+    return [...(this.users.get(file) ?? [])].sort();\n+  }\n+\n+  rename(from: string, to: string): void {\n+    const pages = this.users.get(from);\n+    if (!pages) return;\n+    this.users.delete(from);\n+    this.users.set(to, pages);\n+  }\n+}",
      "text": "// Which pages use which files: a page uses its source, its layout and the theme's partials.\n// After a change, exactly the pages that use a changed file are built again.\n\nexport class DependencyGraph {\n  private readonly users = new Map\u003cstring, Set\u003cstring\u003e\u003e();\n\n  record(page: string, files: Iterable\u003cstring\u003e): void {\n    this.forget(page);\n    for (const file of files) {\n      let pages = this.users.get(file);\n      if (!pages) {\n        pages = new Set();\n        this.users.set(file, pages);\n      }\n      pages.add(page);\n    }\n  }\n\n  forget(page: string): void {\n    for (const pages of this.users.values()) pages.delete(page);\n  }\n\n  pagesUsing(file: string): string[] {\n    return [...(this.users.get(file) ?? [])].sort();\n  }\n\n  rename(from: string, to: string): void {\n    const pages = this.users.get(from);\n    if (!pages) return;\n    this.users.delete(from);\n    this.users.set(to, pages);\n  }\n}\n"

     "markdown": "# Ship card: #44, Show each page's reading time\n\nBranch `marigold/44-reading-time` at `5e1c9a2`: 6 commits off `main` at `3f2a9c1`, tree clean. Ready to land.\n\n## What the change does\n\nEvery page's data gains `wordCount` and `readingTime`. Words are counted the way a reader would: code, HTML tags and comments are left out, and a hyphenated word counts once. The speed is 238 words a minute unless `readingSpeed` in `marigold.toml` says otherwise, and a page may set its own `readingTime`. The default theme shows \"6 min read\" under a post's title.\n\n## Checks\n\n| check | commit | result | time |\n|---|---|---|---|\n| gate: `bun run check` | `5e1c9a2` | pass | 99 s |\n| build the example site | `5e1c9a2` | pass | 41 s |\n| blind acceptance tests | `5e1c9a2` | 5 of 5 | 3 s |\n\n## Turnpikes\n\n- style: 2 rounds; one P3 left, to aftercare.\n- bug: 2 rounds; 4 findings, all fixed.\n- security: 2 rounds; nothing found.\n\n## Open findings\n\nNone.\n\n## Style residue (1, to aftercare)\n\n- `docs/front-matter.md`: name the setting as it is written in `marigold.toml`.\n\n## Merge\n\nThe postmaster lands it. Nothing on this card needs the user.\n"

    "head": "5e1c9a2",
    "spec": "# Workhorse spec: #44, Show each page's reading time\n\n## Summary\n\nA new module counts a page's words the way a reader would and turns the count into minutes. `loadPage` adds both figures to every page's data, `loadConfig` reads the reading speed, and the default theme shows the minutes under a post's title.\n\n## Technical context\n\n- **Language**: TypeScript run by Bun.\n- **Dependencies**: none added.\n- **Testing**: `bun test`, and the gate, `bun run check`.\n- **Constraints**: the count must not change when a page changes only its code blocks.\n\n## Structure\n\n- `src/reading-time.ts`: `readableText`, `countWords`, `readingMinutes` and the default speed.\n- `src/reading-time.test.ts`: its tests.\n- `src/page.ts`: `wordCount` and `readingTime` on `PageData`.\n- `src/config.ts`: `readingSpeed`, checked when the config is read.\n- `themes/default/post.html`: \"N min read\" under the title.\n- `docs/front-matter.md` and `CHANGELOG.md`.\n\n## Decisions\n\n1. Minutes round up: a 476-word page at 238 words a minute reads 2, and at 200 it reads 3.\n2. A page's own `readingTime` wins when it is a whole number above 0, written as a number or as quoted text.\n3. A `readingSpeed` that is not a positive number stops the build, naming the setting.\n\n## Showing each criterion\n\n| criterion | check |\n|---|---|\n| 1 | `bun test src/reading-time.test.ts`, and a 476-word example page built with `marigold build examples/blog --dump-data` |\n| 2 | the same page built with `readingSpeed = 200` |\n| 3 | an example page with `readingTime: 10` in its front matter |\n| 4 | \"2 min read\" found in the built page |\n| 5 | the docs page, read through |\n\n## Tasks\n\n- [ ] T001 [AC1] `src/reading-time.ts` and its tests\n- [ ] T002 [AC1, AC3] the two fields in `loadPage`\n- [ ] T003 [AC2] `readingSpeed` in `loadConfig`\n- [ ] T004 [AC4] the theme\n- [ ] T005 [AC5] the docs and the changelog\n",
    "summary": "Every page's data gains `wordCount` and `readingTime`, and the default theme shows \"N min read\" under a post's title.\n\n- `src/reading-time.ts` counts words the way a reader would: fenced code, inline code, HTML tags and comments are removed first, a link counts by its text, and a hyphenated word counts once. Minutes round up and are at least 1.\n- `src/page.ts` adds both fields. A page's own `readingTime` wins, as a number or as quoted text.\n- `src/config.ts` reads `readingSpeed`, 238 words a minute by default, and stops the build when it is not a positive number.\n- `themes/default/post.html` shows the minutes beside the date, and on a page without a date too.\n- `docs/front-matter.md` and `CHANGELOG.md` describe the change.\n\n**Checks.** The gate passed at the head (`5e1c9a2`) in 99 s, the example site builds, and the five blind acceptance tests pass. Two review rounds; nothing is left open but one style note on the docs, which goes to aftercare.\n",

      "path": "src/reading-time.ts",

      "lang": "typescript",
      "lines": 33,
      "diff": "@@ -0,0 +1,33 @@\n+// Count a page's words the way a reader would, and turn the count into minutes.\n+// Code, markup and comments are not read, so they are removed before counting.\n+\n+export const DEFAULT_WORDS_PER_MINUTE = 238;\n+\n+const FENCED_CODE = /^(```|~~~)[^\\n]*\\n[\\s\\S]*?^\\1[^\\n]*$/gm;\n+const HTML_COMMENT = /\u003c!--[\\s\\S]*?--\u003e/g;\n+const INLINE_CODE = /`[^`\\n]*`/g;\n+const HTML_TAG = /\u003c\\/?[a-zA-Z][^\u003e]*\u003e/g;\n+const MARKDOWN_LINK = /\\[([^\\]]*)\\]\\([^)]*\\)/g;\n+const HAS_LETTER_OR_DIGIT = /[\\p{L}\\p{N}]/u;\n+\n+export function readableText(markdown: string): string {\n+  return markdown\n+    .replace(FENCED_CODE, \" \")\n+    .replace(HTML_COMMENT, \" \")\n+    .replace(INLINE_CODE, \" \")\n+    .replace(HTML_TAG, \" \")\n+    .replace(MARKDOWN_LINK, \"$1\");\n+}\n+\n+export function countWords(markdown: string): number {\n+  // Split on whitespace only, so a hyphenated word such as \"e-mail\" counts once.\n+  const words = readableText(markdown).split(/\\s+/);\n+  return words.filter((word) =\u003e HAS_LETTER_OR_DIGIT.test(word)).length;\n+}\n+\n+export function readingMinutes(words: number, wordsPerMinute = DEFAULT_WORDS_PER_MINUTE): number {\n+  if (!Number.isFinite(wordsPerMinute) || wordsPerMinute \u003c= 0) {\n+    throw new RangeError(`readingSpeed must be a positive number, not ${wordsPerMinute}`);\n+  }\n+  return Math.max(1, Math.ceil(words / wordsPerMinute));\n+}",
      "text": "// Count a page's words the way a reader would, and turn the count into minutes.\n// Code, markup and comments are not read, so they are removed before counting.\n\nexport const DEFAULT_WORDS_PER_MINUTE = 238;\n\nconst FENCED_CODE = /^(```|~~~)[^\\n]*\\n[\\s\\S]*?^\\1[^\\n]*$/gm;\nconst HTML_COMMENT = /\u003c!--[\\s\\S]*?--\u003e/g;\nconst INLINE_CODE = /`[^`\\n]*`/g;\nconst HTML_TAG = /\u003c\\/?[a-zA-Z][^\u003e]*\u003e/g;\nconst MARKDOWN_LINK = /\\[([^\\]]*)\\]\\([^)]*\\)/g;\nconst HAS_LETTER_OR_DIGIT = /[\\p{L}\\p{N}]/u;\n\nexport function readableText(markdown: string): string {\n  return markdown\n    .replace(FENCED_CODE, \" \")\n    .replace(HTML_COMMENT, \" \")\n    .replace(INLINE_CODE, \" \")\n    .replace(HTML_TAG, \" \")\n    .replace(MARKDOWN_LINK, \"$1\");\n}\n\nexport function countWords(markdown: string): number {\n  // Split on whitespace only, so a hyphenated word such as \"e-mail\" counts once.\n  const words = readableText(markdown).split(/\\s+/);\n  return words.filter((word) =\u003e HAS_LETTER_OR_DIGIT.test(word)).length;\n}\n\nexport function readingMinutes(words: number, wordsPerMinute = DEFAULT_WORDS_PER_MINUTE): number {\n  if (!Number.isFinite(wordsPerMinute) || wordsPerMinute \u003c= 0) {\n    throw new RangeError(`readingSpeed must be a positive number, not ${wordsPerMinute}`);\n  }\n  return Math.max(1, Math.ceil(words / wordsPerMinute));\n}\n"

      "text": "import { readFile } from \"node:fs/promises\";\nimport { basename, extname, relative } from \"node:path\";\nimport { parseFrontMatter } from \"./front-matter.ts\";\nimport type { SiteConfig } from \"./config.ts\";\nimport { countWords, readingMinutes } from \"./reading-time.ts\";\n\nexport interface PageData {\n  path: string;\n  url: string;\n  title: string;\n  date?: string;\n  tags: string[];\n  draft: boolean;\n  wordCount: number;\n  readingTime: number;\n  body: string;\n  data: Record\u003cstring, unknown\u003e;\n}\n\nfunction urlFor(path: string, config: SiteConfig): string {\n  const rel = relative(config.contentDir, path);\n  const name = basename(rel, extname(rel));\n  const dir = rel.slice(0, rel.length - basename(rel).length);\n  if (!config.prettyUrls) return `/${dir}${name}.html`;\n  return name === \"index\" ? `/${dir}` : `/${dir}${name}/`;\n}\n\nfunction stringList(value: unknown): string[] {\n  if (Array.isArray(value)) return value.map(String);\n  if (typeof value === \"string\") {\n    return value\n      .split(\",\")\n      .map((tag) =\u003e tag.trim())\n      .filter(Boolean);\n  }\n  return [];\n}\n\nfunction ownReadingTime(value: unknown): number | undefined {\n  // A page's own figure wins. YAML reads `readingTime: 10` as a number and `\"10\"` as text.\n  const minutes = typeof value === \"string\" ? Number(value.trim()) : value;\n  return typeof minutes === \"number\" \u0026\u0026 Number.isInteger(minutes) \u0026\u0026 minutes \u003e 0 ? minutes : undefined;\n}\n\nexport async function loadPage(path: string, config: SiteConfig): Promise\u003cPageData\u003e {\n  const source = await readFile(path, \"utf8\");\n  const { data, body } = parseFrontMatter(source);\n  const title = typeof data.title === \"string\" ? data.title : basename(path, extname(path));\n  const wordCount = countWords(body);\n  return {\n    path,\n    url: urlFor(path, config),\n    title,\n    date: typeof data.date === \"string\" ? data.date : undefined,\n    tags: stringList(data.tags),\n    draft: data.draft === true,\n    wordCount,\n    readingTime: ownReadingTime(data.readingTime) ?? readingMinutes(wordCount, config.readingSpeed),\n    body,\n    data,\n  };\n}\n"

      "text": "import { readFile } from \"node:fs/promises\";\nimport { resolve } from \"node:path\";\nimport { DEFAULT_WORDS_PER_MINUTE } from \"./reading-time.ts\";\nimport { parse } from \"./toml.ts\";\n\nexport interface SiteConfig {\n  title: string;\n  baseUrl: string;\n  contentDir: string;\n  outputDir: string;\n  themeDir: string;\n  prettyUrls: boolean;\n  drafts: boolean;\n  readingSpeed: number;\n}\n\nconst DEFAULTS: Omit\u003cSiteConfig, \"title\" | \"baseUrl\"\u003e = {\n  contentDir: \"content\",\n  outputDir: \"public\",\n  themeDir: \"themes/default\",\n  prettyUrls: true,\n  drafts: false,\n  readingSpeed: DEFAULT_WORDS_PER_MINUTE,\n};\n\nfunction requireString(raw: Record\u003cstring, unknown\u003e, key: string): string {\n  const value = raw[key];\n  if (typeof value !== \"string\" || value.trim() === \"\") {\n    throw new Error(`marigold.toml: ${key} must be a non-empty string`);\n  }\n  return value;\n}\n\nexport async function loadConfig(root: string): Promise\u003cSiteConfig\u003e {\n  const raw = parse(await readFile(resolve(root, \"marigold.toml\"), \"utf8\"));\n  const config: SiteConfig = {\n    ...DEFAULTS,\n    title: requireString(raw, \"title\"),\n    baseUrl: requireString(raw, \"baseUrl\").replace(/\\/+$/, \"\"),\n  };\n  for (const key of [\"contentDir\", \"outputDir\", \"themeDir\"] as const) {\n    const given = raw[key];\n    config[key] = resolve(root, typeof given === \"string\" ? given : config[key]);\n  }\n  if (typeof raw.prettyUrls === \"boolean\") config.prettyUrls = raw.prettyUrls;\n  if (raw.readingSpeed !== undefined) {\n    const speed = raw.readingSpeed;\n    if (typeof speed !== \"number\" || !Number.isFinite(speed) || speed \u003c= 0) {\n      throw new Error(\"marigold.toml: readingSpeed must be a positive number of words a minute\");\n    }\n    config.readingSpeed = speed;\n  }\n  return config;\n}\n"

      "text": "# Front matter\n\nEach page starts with a block of YAML between two `---` lines. marigold reads it before the\npage's text and gives every field to the theme as `page.\u003cfield\u003e`.\n\n```yaml\n---\ntitle: Notes from the harbour\ndate: 2026-09-14\ntags: [travel, boats]\n---\n```\n\n## Fields marigold reads\n\n| field | what it does |\n|---|---|\n| `title` | The page's title. Without one, the file name is used. |\n| `date` | The page's date, as `YYYY-MM-DD`. Pages without a date are left out of feeds. |\n| `tags` | A list of tags, or one string of tags separated by commas. |\n| `draft` | `true` keeps the page out of the build unless `marigold build --drafts` is given. |\n| `readingTime` | Minutes to read the page, when you want to set it yourself. |\n\nAny other field is passed to the theme as it is.\n\n## Fields marigold adds\n\n| field | what it holds |\n|---|---|\n| `url` | The page's address on the site, such as `/notes/harbour/`. |\n| `html` | The page's text, rendered. |\n| `wordCount` | The words a reader reads: the page's text without code, HTML tags and comments. |\n| `readingTime` | Whole minutes to read the page, at least 1, unless the page sets its own. |\n\n## Reading speed\n\nmarigold counts 238 words a minute. Set `readingSpeed` in `marigold.toml` to change it:\n\n```toml\nreadingSpeed = 200\n```\n"

function syntax(text,lang) {
  if(lang==='markdown' && /^\s*#{1,6}\s/.test(text)) return `<span class="tok-keyword">${esc(text)}</span>`;
  const re=/"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`|\/\/.*|\/\*.*?(?:\*\/|$)|<!--[\s\S]*?(?:-->|$)|\b(?:export|import|from|const|let|var|function|return|async|await|if|else|for|of|in|new|throw|class|interface|type|as|typeof|instanceof|true|false|null|undefined|number|string|boolean|void|readonly|default|extends)\b|\b\d+(?:\.\d+)?\b|<\/?[A-Za-z][\w-]*/g;
  let out='',last=0;
  for(const match of text.matchAll(re)) {
    const token=match[0]; let kind='keyword';
    if(/^["'`]/.test(token)) kind='string';
    else if(/^\/\/|^\/\*|^<!--/.test(token)) kind='comment';
    else if(/^\d/.test(token)) kind='number';
    else if(/^</.test(token)) kind='tag';
    out+=esc(text.slice(last,match.index))+`<span class="tok-${kind}">${esc(token)}</span>`;
    last=match.index+token.length;
  }
  return out+esc(text.slice(last));
}
function parseDiff(file) {
  let oldLine=0,newLine=0; const result=[];

    if(match) { oldLine=Number(match[1]);newLine=Number(match[2]);result.push({kind:'hunk',text:line}); }
    else if(line.startsWith('+')) result.push({kind:'add',old:null,new:newLine++,text:line.slice(1)});
    else if(line.startsWith('-')) result.push({kind:'del',old:oldLine++,new:null,text:line.slice(1)});
    else if(line.startsWith(' ')) result.push({kind:'context',old:oldLine++,new:newLine++,text:line.slice(1)});
    else if(line.startsWith('\\')) result.push({kind:'hunk',text:line});

}
function fileLines(file) { const lines=file.text.split('\n'); if(lines.at(-1)==='') lines.pop(); return lines; }

  </button>`;
}
function renderCode(run) {

function renderChange() {

function updateClocks() {
  const age=elapsedSeconds();
  document.querySelectorAll('[data-since]').forEach(el=>{ const value=duration((now()-Date.parse(el.dataset.since))/1000); if(el.textContent!==value) el.textContent=value; });
  document.querySelectorAll('[data-idle]').forEach(el=>{ const value=duration(Number(el.dataset.idle)*60+(el.dataset.frozen==='true'?0:age)); if(el.textContent!==value) el.textContent=value; });

  document.querySelectorAll('[data-run-health]').forEach(el=>el.hidden=!stalled(runById(el.dataset.runHealth)));
  document.querySelectorAll('[data-run-wait]').forEach(el=>{const r=runById(el.dataset.runWait);el.classList.toggle('wait-panel',r.next==='USER'||stalled(r));});
  document.querySelectorAll('[data-stall-count]').forEach(el=>el.textContent=data.runs.filter(stalled).length);
  document.querySelectorAll('[data-round-start]').forEach(el=>el.style.width=`${Math.min(100,(now()-Date.parse(el.dataset.roundStart))/1000/Number(el.dataset.roundLimit)*100)}%`);
  const freshKey=age<60?Math.floor(age/10):100+Math.floor(age/60);
  if(freshKey!==lastFreshMinute) {
    lastFreshMinute=freshKey;
    document.getElementById('freshness').classList.toggle('stale',age>=60);
    document.getElementById('freshness-text').textContent=age>=60?`Stale · no new data for ${duration(age)}`:`Read ${clockTime(data.read_at,true)} UTC · ${age<10?'just now':duration(age)+' ago'}`;
  }
}
function render() {
  main.innerHTML=state.page==='run'?renderRun():state.page==='change'?renderChange():renderHome();
  document.title=state.page==='home'?'postmaster dashboard':`#${runById(state.runId).ticket.number} · ${state.page==='change'?'change':'run'} · postmaster`;
  updateClocks();
  document.querySelectorAll('.launch[open] .events').forEach(el=>{el.scrollTop=el.scrollHeight;});
}
function navigate(page,runId=state.runId) {
  const nextRun=runById(runId);
  if(page==='run'&&!nextRun || page==='change'&&!nextRun?.change) return;
  const sameRun=state.runId===String(runId);
  state={...state,page,runId:String(runId),...(!sameRun?{file:0,docTab:'Summary',codeTab:'Diff',mobileTab:'Summary'}:{})};
  selection=null;
  clearTimeout(toastTimer);document.getElementById('toast').hidden=true;
  history.pushState({...state},'',`#${page}`);
  render(); window.scrollTo({top:0,behavior:'instant'}); main.focus({preventScroll:true});
}
